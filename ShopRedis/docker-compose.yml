version: '3.8'
services:
  redis-7001:
    image: redis:latest
    container_name: redis-7001
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "7001:6379"
      - "17001:16379"
    volumes:
      - D:/ShopAi/ShopRedis/7001/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-7001-data:/data
    networks:
      my-net:
        ipv4_address: 172.28.0.11

  redis-7002:
