# ======================================================================
# shopai-order 订单服务配置
# 职责：购物车/地址/订单状态机/退款/自动收货完成定时任务；
#       下单/退款通过 Seata + Feign 调 shopai-inventory 扣减/回补库存，
#       累销量通过 Feign 调 shopai-product 内部接口。
# 端口：8083
# 说明：本服务不各自验签 JWT（网关统一认证），身份从 X-User-* 头读取。
# ======================================================================

server:
  port: 8083

spring:
  application:
    name: shopai-order

  # ---------- Nacos 配置中心（按需启用；本地无 Nacos 时注释掉 cloud.nacos 与 config.import） ----------
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  config:
    import:
      - optional:nacos:shopai-order.yml

  # ---------- 数据源（共享单库 hcq_shop，与单体一致） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hcq_shop?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username:
    password:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # ---------- Redis（订单/购物车/地址缓存） ----------
  data: # ← 加一层 data
    redis:
      cluster:
        nodes:

        max-redirects: 3
      timeout: 5000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shopai.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---------- Feign（与服务调用相关） ----------
feign:
  httpclient:
    enable: true
    max-connections: 200 # 最大连接数
    max-connections-per-route: 50 # 单个路径最大连接数
  sentinel:
    enabled: true # 开启sentinel支持

# ---------- Seata（AT 分布式事务，下单全局事务发起方；本地无 Seata Server 时可注释掉） ----------
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: true
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ""
      group: SEATA_GROUP
      username: nacos
      password: nacos
      data-id: seataServer.properties
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      namespace: ""
      group: SEATA_GROUP
      username: nacos
      password: nacos

# ---------- 上传路径（本服务不托管静态资源，仅保证启动不报错） ----------
upload:
  path: D:\ShopAi\VorI\Images

logging:
  level:
    com.shopai.order: debug
