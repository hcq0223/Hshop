version: '3.8'
services:
  elasticsearch:
    image: elasticsearch:8.11.1 
    container_name: es8.11.1
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled=false" 
    volumes:
      - D:\dockerES\es-8.11.1\plugins:/usr/share/elasticsearch/plugins  
      - D:\dockerES\es-8.11.1\data:/usr/share/elasticsearch/data        
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - my-net
  
  kibana:
    image: kibana:8.11.1
    container_name: kibana8.11.1
    environment:
      - "ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - my-net
  
  sentinel-dashboard:
    image: ochh/sentinel-dashboard:v1.8.8
    container_name: sentinel-dashboard
    ports:
      - "8858:8858"           
    environment:
      - TZ=Asia/Shanghai
    restart: always
    networks:
      - my-net

networks:
  my-net:
    external: true
    name: shopai