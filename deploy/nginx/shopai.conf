# ======================================================================
# ShopAi Nginx 配置（生产部署，可直接使用）
# ----------------------------------------------------------------------
# 架构：
#   浏览器 ──▶ Nginx(80/443)
#                ├─ /            → 前端静态资源（Vue 打包产物 dist）
#                ├─ /api/        → Spring Cloud Gateway (127.0.0.1:8080)
#                ├─ /uploads/    → Spring Cloud Gateway (127.0.0.1:8080 → shopai-user 静态资源)
#                └─ /agent/      → Python AI 服务 (127.0.0.1:8090, SSE 流式)
#
# 说明：
#   - Nginx 只做「静态资源 + 反向代理」，不做业务鉴权/路由分流（那是网关的职责）。
#   - 所有 /api 请求统一打到网关 8080，由网关再路由到各微服务。
#
# 部署路径建议：/etc/nginx/conf.d/shopai.conf
# 修改以下 3 处即可用：
#   1) server_name        → 你的域名或服务器 IP
#   2) root               → 前端 dist 实际路径
#   3) proxy_pass 的地址   → 网关/Python 服务实际地址（同机默认 127.0.0.1）
# ======================================================================

# ---- 上游（同机部署可省，直接写 127.0.0.1:端口 也行；此处便于日后扩展多实例） ----
upstream shopai_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}
upstream shopai_agent {
    server 127.0.0.1:8090;
    keepalive 16;
}

# ---- HTTP：80 端口 ----
server {
    listen       80;
    listen       [::]:80;
    server_name  shopai.example.com;   # ← 改成你的域名或服务器公网 IP

    # 前端打包产物目录（vite build 默认输出到 Vue/dist）
    root         /var/www/shopai/dist; # ← 改成 dist 实际路径
    index        index.html;

    # 上传文件大小上限（与后端一致，图片上传需要）
    client_max_body_size 20m;

    # 访问日志 / 错误日志（按需改）
    access_log  /var/log/nginx/shopai.access.log;
    error_log   /var/log/nginx/shopai.error.log warn;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml font/woff2;

    # ---------- 前端静态资源 ----------
    location / {
        try_files $uri $uri/ /index.html;   # Vue history 路由回退（刷新不 404）
    }

    # 带 hash 的静态资源长缓存（Vite 产物文件名含 hash，可放心强缓存）
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # index.html 不缓存，保证前端发版后立即可见
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- API：统一反代到 Spring Cloud Gateway ----------
    location /api/ {
        proxy_pass http://shopai_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 后端处理/上传可能较慢，放宽超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 上传的图片：同样走网关（网关路由到 shopai-user 的 /uploads/**） ----------
    location /uploads/ {
        proxy_pass http://shopai_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- Python AI 服务：SSE 流式对话 ----------
    # /agent/chat/stream 是 EventSource(SSE)，必须关闭代理缓冲，否则前端收不到实时分片
    location /agent/ {
        proxy_pass http://shopai_agent;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";

        # SSE 关键三行
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;   # 长连接，避免思考中途被断开
    }

    # 隐藏 Nginx 版本号
    server_tokens off;
}

